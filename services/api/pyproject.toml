[project]
name = "qa-forge-api"
version = "0.1.0"
description = "QA Forge API — test case generation, reporting and execution"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "pyjwt>=2.15.1",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
    "docxtpl>=0.20.2",
    "openai>=3.22.1",
    "anthropic>=1.11.0",
    "pdfplumber>=0.11.10",
    "playwright",
    "cryptography",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-openpyxl>=3.1.5.20260827",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.23",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live_llm: calls the real Anthropic API (opt-in)",
    "needs_libreoffice: requires LibreOffice headless",
    "needs_postgres: requires a PostgreSQL server",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S603", "S607"]
"alembic/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = "docxtpl.*"
ignore_missing_imports = true
