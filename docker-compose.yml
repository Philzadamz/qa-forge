# Full stack (PRD §4.1). Not yet verified — authored on a machine without Docker
# (docs/decisions/001). Run `make up`, then check http://localhost:3000 and :8000/ready.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qaforge
      POSTGRES_PASSWORD: qaforge
      POSTGRES_DB: qaforge
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qaforge"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql+psycopg://qaforge:qaforge@db:5432/qaforge
      REDIS_URL: redis://redis:6379/0
      # Switch to s3 once the S3 storage backend lands (docs/decisions/001).
      STORAGE_BACKEND: local
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - ./templates:/app/templates:ro
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: ./apps/web
    environment:
      API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
